<header class="site-header">
  <a href="{{ '/' | relative_url }}" class="site-brand">lacamiseta.org</a>
  <button class="nav-toggle" aria-label="Menú" aria-expanded="false" aria-controls="main-nav">
    <span class="nav-toggle__bar"></span>
    <span class="nav-toggle__bar"></span>
    <span class="nav-toggle__bar"></span>
  </button>
  <nav class="main-nav" id="main-nav">
    <ul class="main-nav__list" role="list">
      <li><a href="{{ '/' | relative_url }}" class="main-nav__link">Inicio</a></li>
      <li><a href="{{ '/#que-es' | relative_url }}" class="main-nav__link">¿Qué es?</a></li>
      <li class="main-nav__group">
        <span class="main-nav__group-title">Causas urgentes</span>
        <ul class="main-nav__sublist" role="list">
          {% assign sorted_causes = site.causes | sort: "order" %}
          {% for cause in sorted_causes %}
          <li><a href="{{ cause.url | relative_url }}" class="main-nav__link main-nav__link--sub">{{ cause.title }}</a></li>
          {% endfor %}
        </ul>
      </li>
    </ul>
  </nav>
</header>
